<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace entreprise — {app}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07170f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="B2B Connect">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app">
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand"><img src="assets/img/logo.svg" alt="" width="30" height="30"><span data-app-name></span></a>
    <span class="role-pill">Espace entreprise</span>
    <div class="topbar-right"><button class="btn btn-sm btn-accent" data-install hidden><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 21h14"/></svg><span>Installer</span></button><span class="who" id="who"></span><button class="btn btn-sm btn-ghost" id="logout">Déconnexion</button></div>
  </div>
  <nav class="container app-tabs" role="tablist">
    <button class="tab" role="tab" data-tab="accueil"><svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tab-long">Tableau de bord</span><span class="tab-short">Accueil</span></button>
    <button class="tab" role="tab" data-tab="demandes"><svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><path d="M8 4h8M9 2h6v4H9zM6 4H5a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M8 11h8M8 15h5"/></svg><span class="tab-long">Mes demandes de devis</span><span class="tab-short">Demandes</span></button>
    <button class="tab" role="tab" data-tab="catalogue"><svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="tab-long">Catalogue fournisseurs</span><span class="tab-short">Catalogue</span></button>
    <button class="tab" role="tab" data-tab="fiche"><svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3"/></svg><span class="tab-long">Mon entreprise</span><span class="tab-short">Profil</span></button>
  </nav>
</header>
<main class="container app-main">
  <div id="statusBox"></div>
  <section data-panel="accueil">
    <div class="page-head"><h1>Tableau de bord</h1><button class="btn btn-accent" id="newRfq">+ Nouvelle demande de devis</button></div>
    <div class="stats" id="stats"></div>
    <div class="card"><h2 class="h3">Dernières offres reçues</h2><div id="latestOffers"></div></div>
  </section>
  <section data-panel="demandes" hidden>
    <div class="page-head"><h1>Mes demandes de devis</h1><button class="btn btn-accent" id="newRfq2">+ Nouvelle demande</button></div>
    <div id="rfqList"></div>
  </section>
  <section data-panel="catalogue" hidden>
    <div class="page-head"><h1>Catalogue fournisseurs</h1></div>
    <div id="catalogue"></div>
  </section>
  <section data-panel="fiche" hidden>
    <div class="page-head"><h1>Mon entreprise</h1></div>
    <div id="profile"></div>
  </section>
</main>
<script type="module" src="assets/js/entreprise.js"></script>
<script type="module" src="assets/js/pwa.js"></script>
</body>
</html>
