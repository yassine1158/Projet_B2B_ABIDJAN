<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace entreprise — {app}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"></noscript>
  <!-- Vitesse : connexions ouvertes et scripts téléchargés en parallèle dès le début -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js" crossorigin>
  <link rel="modulepreload" href="assets/js/entreprise.js">
  <link rel="modulepreload" href="assets/js/firebase.js">
  <link rel="modulepreload" href="assets/js/db.js">
  <link rel="modulepreload" href="assets/js/store.js">
  <link rel="modulepreload" href="assets/js/ui.js">
  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/chat.js">
  <link rel="modulepreload" href="assets/js/catalogue.js">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app">
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand"><img src="assets/img/logo.svg" alt="" width="30" height="30"><span data-app-name></span></a>
    <span class="role-pill">Espace entreprise</span>
    <div class="topbar-right"><span class="who" id="who"></span><button class="btn btn-sm btn-ghost" id="logout">Déconnexion</button></div>
  </div>
  <nav class="container app-tabs" role="tablist">
    <button class="tab" role="tab" data-tab="accueil">Tableau de bord</button>
    <button class="tab" role="tab" data-tab="demandes">Mes demandes de devis</button>
    <button class="tab" role="tab" data-tab="catalogue">Catalogue fournisseurs</button>
    <button class="tab" role="tab" data-tab="messages">Messages <span class="count" id="msgCount"></span></button>
    <button class="tab" role="tab" data-tab="fiche">Mon entreprise</button>
  </nav>
</header>
<main class="container app-main">
  <div id="statusBox"></div>
  <section data-panel="accueil">
    <div class="page-head"><h1>Tableau de bord</h1><button class="btn btn-accent" id="newRfq">+ Nouvelle demande de devis</button></div>
    <div class="stats" id="stats"></div>
    <div class="card"><h2 class="h3">Dernières offres reçues</h2><div id="latestOffers"></div></div>
  </section>
  <section data-panel="demandes" hidden>
    <div class="page-head"><h1>Mes demandes de devis</h1><button class="btn btn-accent" id="newRfq2">+ Nouvelle demande</button></div>
    <div id="rfqList"></div>
  </section>
  <section data-panel="catalogue" hidden>
    <div class="page-head"><h1>Catalogue fournisseurs</h1></div>
    <div id="catalogue"></div>
  </section>
  <section data-panel="messages" hidden>
    <div class="page-head"><h1>Messages</h1></div>
    <div id="chat"></div>
  </section>
  <section data-panel="fiche" hidden>
    <div class="page-head"><h1>Mon entreprise</h1></div>
    <div id="profile"></div>
  </section>
</main>
<script type="module" src="assets/js/entreprise.js"></script>
</body>
</html>
