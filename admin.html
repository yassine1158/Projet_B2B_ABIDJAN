<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — {app}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app">
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand"><img src="assets/img/logo.svg" alt="" width="30" height="30"><span data-app-name></span></a>
    <span class="role-pill">Administration</span>
    <div class="topbar-right"><span class="who" id="who"></span><button class="btn btn-sm btn-ghost" id="logout">Déconnexion</button></div>
  </div>
  <nav class="container app-tabs" role="tablist">
    <button class="tab" role="tab" data-tab="accueil">Vue d'ensemble</button>
    <button class="tab" role="tab" data-tab="fournisseurs">Fournisseurs <span class="count" id="pendingCount"></span></button>
    <button class="tab" role="tab" data-tab="entreprises">Entreprises</button>
    <button class="tab" role="tab" data-tab="demandes">Demandes de devis</button>
    <button class="tab" role="tab" data-tab="categories">Catégories</button>
  </nav>
</header>
<main class="container app-main">
  <section data-panel="accueil">
    <div class="page-head"><h1>Vue d'ensemble</h1></div>
    <div class="stats" id="stats"></div>
    <div class="card"><h2 class="h3">Activité récente</h2><div id="activity"></div></div>
  </section>
  <section data-panel="fournisseurs" hidden>
    <div class="page-head"><h1>Fournisseurs</h1>
      <div class="seg" role="group" aria-label="Filtrer">
        <button type="button" class="seg-btn" data-sf="pending" aria-pressed="true">À valider</button>
        <button type="button" class="seg-btn" data-sf="approved" aria-pressed="false">Validés</button>
        <button type="button" class="seg-btn" data-sf="suspended" aria-pressed="false">Suspendus</button>
        <button type="button" class="seg-btn" data-sf="all" aria-pressed="false">Tous</button>
      </div>
    </div>
    <div id="supplierList"></div>
  </section>
  <section data-panel="entreprises" hidden>
    <div class="page-head"><h1>Entreprises</h1></div>
    <div id="companyList"></div>
  </section>
  <section data-panel="demandes" hidden>
    <div class="page-head"><h1>Demandes de devis</h1></div>
    <div id="rfqList"></div>
  </section>
  <section data-panel="categories" hidden>
    <div class="page-head"><h1>Catégories</h1></div>
    <form class="card stack" id="catForm"></form>
  </section>
</main>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
