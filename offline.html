<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors connexion — B2B Connect</title>
  <meta name="theme-color" content="#07170f">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--navy); color: #fff; }
    body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 5px; background: var(--kente); }
    img { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px; }
    p { color: rgba(255,255,255,.7); max-width: 340px; margin: 10px auto 24px; }
  </style>
</head>
<body>
  <div>
    <img src="assets/img/icon-192.png" alt="">
    <h1>Pas de connexion internet</h1>
    <p>Vérifiez votre réseau (données mobiles ou Wi-Fi), puis réessayez. Vos demandes et offres vous attendent.</p>
    <button class="btn btn-accent" onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
