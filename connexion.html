<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — {app}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-side">
    <a href="index.html" class="brand brand-light"><img src="assets/img/logo.svg" alt="" width="34" height="34"><span data-app-name></span></a>
    <div>
      <h2>Entreprises et fournisseurs, sur une seule plateforme.</h2>
      <ul class="checklist checklist-light">
        <li>Demandes de devis et offres en ligne</li>
        <li>Fournisseurs vérifiés</li>
        <li>Gratuit pour démarrer</li>
      </ul>
    </div>
    <p class="small">© <span data-year></span> <span data-app-name></span></p>
  </div>
  <main class="auth-main">
    <a href="index.html" class="back">← Retour au site</a>
    <div class="auth-box" id="authBox"><div class="loading">Chargement…</div></div>
  </main>
  <script type="module" src="assets/js/auth-page.js"></script>
</body>
</html>
