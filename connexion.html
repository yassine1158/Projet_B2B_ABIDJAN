<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connexion — {app}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07170f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="B2B Connect">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-side">
    <a href="index.html" class="brand brand-light"><img src="assets/img/logo.svg" alt="" width="34" height="34"><span data-app-name></span></a>
    <div>
      <p class="akwaba-sm">Akwaba !</p>
      <h2>Entreprises et fournisseurs de Côte d'Ivoire, sur une seule plateforme.</h2>
      <ul class="checklist checklist-light">
        <li>Demandes de devis et offres en ligne</li>
        <li>Fournisseurs vérifiés</li>
        <li>Prix en FCFA, 0 commission</li>
      </ul>
    </div>
    <p class="small">© <span data-year></span> <span data-app-name></span></p>
  </div>
  <main class="auth-main">
    <a href="index.html" class="back">← Retour au site</a>
    <div class="auth-box" id="authBox"><div class="loading">Chargement…</div></div>
  </main>
  <script type="module" src="assets/js/auth-page.js"></script>
<script type="module" src="assets/js/pwa.js"></script>
</body>
</html>
